<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaPay — Money Buddy Chat</title>
  <style>
    :root {
      --bg-1: #eef4ff;
      --bg-2: #f7f4ff;
      --panel: #ffffffcc;
      --text: #20304a;
      --muted: #5d6b84;
      --line: #dbe5ff;
      --accent: #6a7dff;
      --accent-2: #8a7bff;
      --user: #6a7dff;
      --bot: #f1f5ff;
      --ok: #2b9e7a;
      --shadow: 0 20px 40px rgba(83, 99, 140, 0.15);
      --top-bg: linear-gradient(180deg, #ffffffcc, #ffffffaa);
      --chat-bg-a: #f8f6ff;
      --chat-bg-b: #eef4ff;
      --composer-bg: #ffffffd9;
      --typing-bg: #f8fbff;
      --typing-border: #dfe8ff;
      --chip-bg: #f8faff;
      --chip-text: #3b4f78;
      --chip-hover: #eef3ff;
      --title: #1d2d4d;
    }

    body[data-theme="dark"] {
      --bg-1: #0e1424;
      --bg-2: #161d33;
      --panel: #1a233ad9;
      --text: #e7eeff;
      --muted: #b3c0e4;
      --line: #2b395f;
      --accent: #8ea2ff;
      --accent-2: #9e8dff;
      --user: #5f75ff;
      --bot: #24314f;
      --ok: #4fd6aa;
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
      --top-bg: linear-gradient(180deg, #1d2741ee, #1a233add);
      --chat-bg-a: #1b2742;
      --chat-bg-b: #14203a;
      --composer-bg: #1b2641e6;
      --typing-bg: #223155;
      --typing-border: #324776;
      --chip-bg: #243456;
      --chip-text: #dce6ff;
      --chip-hover: #2b3d66;
      --title: #f1f5ff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at -10% -10%, #dfe9ff 0%, transparent 60%),
        radial-gradient(900px 500px at 110% -20%, #e9e2ff 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      padding: 24px 14px 40px;
      transition: background 220ms ease, color 220ms ease;
    }

    body[data-theme="dark"] {
      background:
        radial-gradient(1200px 600px at -10% -10%, #1a2750 0%, transparent 60%),
        radial-gradient(900px 500px at 110% -20%, #32255a 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      border: 1px solid #ffffffa6;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: background 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    body[data-theme="dark"] .app {
      border-color: #2d3c66;
    }

    .top {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--top-bg);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mascot {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(160deg, var(--accent), var(--accent-2));
      position: relative;
      box-shadow: inset 0 -6px 14px rgba(0,0,0,0.12);
      flex: 0 0 auto;
      animation: floaty 3.2s ease-in-out infinite;
    }

    .eye {
      position: absolute;
      top: 20px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      animation: blink 4.5s infinite;
      transform-origin: center;
    }

    .eye.left { left: 16px; }
    .eye.right { right: 16px; }

    .smile {
      position: absolute;
      left: 50%;
      bottom: 13px;
      width: 20px;
      height: 10px;
      transform: translateX(-50%);
      border-bottom: 3px solid #fff;
      border-radius: 0 0 14px 14px;
    }

    @keyframes blink {
      0%, 45%, 47%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(0.1); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw, 1.55rem);
      line-height: 1.15;
      color: var(--title);
    }

    .title-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      color: var(--muted);
      background: color-mix(in srgb, var(--chip-bg) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 15%, transparent);
    }

    .top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .theme-toggle {
      border: 1px solid var(--line);
      background: var(--chip-bg);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: 140ms ease;
    }

    .theme-toggle:hover {
      background: var(--chip-hover);
      transform: translateY(-1px);
    }

    .chat {
      height: min(62vh, 620px);
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        radial-gradient(circle at 85% 0%, var(--chat-bg-a) 0%, transparent 30%),
        radial-gradient(circle at 10% 100%, var(--chat-bg-b) 0%, transparent 35%);
      transition: background 220ms ease;
    }

    .message {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 0.98rem;
      word-wrap: break-word;
      border: 1px solid transparent;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot);
      border-color: var(--line);
      color: var(--text);
      border-top-left-radius: 8px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      color: #fff;
      border-top-right-radius: 8px;
      box-shadow: 0 10px 20px rgba(106, 125, 255, 0.3);
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      background: var(--typing-bg);
      border: 1px solid var(--typing-border);
      border-radius: 12px;
      padding: 8px 10px;
      width: fit-content;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8fa2d9;
      animation: bounce 1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .chips {
      padding: 0 16px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--chip-bg);
      color: var(--chip-text);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 140ms ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      background: var(--chip-hover);
      border-color: color-mix(in srgb, var(--line) 70%, #8fa2d9 30%);
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--composer-bg);
      padding: 12px;
      display: flex;
      gap: 10px;
    }

    .composer input {
      flex: 1;
      border: 1px solid var(--line);
      background: #fff;
      color: #1e2a44;
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      outline: none;
    }

    body[data-theme="dark"] .composer input {
      background: #0f1930;
      color: #eef3ff;
      border-color: #304470;
    }

    .composer input:focus {
      border-color: #b9cafe;
      box-shadow: 0 0 0 4px #6a7dff1f;
    }

    .composer button {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
      min-width: 92px;
    }

    .composer button:hover { filter: brightness(1.03); }

    @media (max-width: 640px) {
      .app { border-radius: 18px; }
      .top { padding: 16px 14px 12px; flex-direction: column; align-items: stretch; }
      .top-right { align-items: flex-start; }
      .chat { height: 58vh; padding: 14px; }
      .message { max-width: 88%; }
      .chips { padding: 0 12px 10px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Money Buddy chatbot interface">
    <header class="top">
      <div class="brand">
        <div class="mascot" aria-hidden="true">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="smile"></span>
        </div>
        <div class="title-wrap">
          <h1>Money Buddy</h1>
          <p>Friendly budgeting help for first-time bank users</p>
        </div>
      </div>

      <div class="top-right">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌙 Night mode</button>
        <div class="status"><span class="dot"></span> AI helper online</div>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <div class="chips" aria-label="Quick prompts">
      <button class="chip" data-q="I get £120 a month. How should I budget it?">Budget my income</button>
      <button class="chip" data-q="How can I avoid impulse spending?">Avoid impulse buys</button>
      <button class="chip" data-q="What should I know before using credit?">Using credit safely</button>
      <button class="chip" data-q="How do I spot a bank scam?">Spot scams</button>
    </div>

    <form id="chatForm" class="composer">
      <input id="userInput" type="text" placeholder="Ask about saving, spending, credit, or scams..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const themeToggle = document.getElementById('themeToggle');

    function addMessage(text, who = 'bot') {
      const msg = document.createElement('div');
      msg.className = `message ${who}`;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.id = 'typingIndicator';
      typing.innerHTML = `
        <span>Money Buddy is typing</span>
        <span class="typing-dots"><span></span><span></span><span></span></span>
      `;
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    function budgetSplit(amount) {
      const needs = (amount * 0.5).toFixed(2);
      const wants = (amount * 0.3).toFixed(2);
      const savings = (amount * 0.2).toFixed(2);
      return `A simple split for £${amount.toFixed(2)} is: Needs £${needs}, Wants £${wants}, Savings £${savings}.`;
    }

    function getReply(raw) {
      const text = raw.toLowerCase();
      const n = text.match(/-?\d+(\.\d+)?/);

      if (n && (text.includes('budget') || text.includes('split') || text.includes('month') || text.includes('income'))) {
        const amount = parseFloat(n[0]);
        if (amount <= 0) return "Let's use a positive amount so I can help you make a realistic plan 💡";
        return budgetSplit(amount) + " You can adjust to 60/20/20 if essentials are expensive.";
      }

      if (text.includes('impulse') || text.includes('spend') || text.includes('shopping')) {
        return "Try the 24-hour pause rule: wait one day before non-essential purchases. Also set a weekly 'fun money' limit so you can spend guilt-free within a boundary.";
      }

      if (text.includes('credit') || text.includes('borrow') || text.includes('loan')) {
        return "Use credit only for planned purchases, repay on time, and keep usage low. Missing payments can hurt your credit history and add interest costs.";
      }

      if (text.includes('scam') || text.includes('fraud') || text.includes('pin') || text.includes('password')) {
        return "Never share your PIN, password, or one-time codes. Banks won't ask for them in messages. If pressured, pause and contact your bank from the official app or website.";
      }

      if (text.includes('save') || text.includes('saving')) {
        return "Start tiny and consistent: automate even 5–10% into savings right after money arrives. Name the goal (e.g., emergency fund) to stay motivated.";
      }

      return "I can help with budgeting, savings, responsible credit use, and scam safety. Try: 'I get £80 a month—how should I split it?'";
    }

    function handleUserMessage(text) {
      addMessage(text, 'user');
      showTyping();

      const delay = 700 + Math.floor(Math.random() * 600);
      setTimeout(() => {
        hideTyping();
        addMessage(getReply(text), 'bot');
      }, delay);
    }

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      const isDark = theme === 'dark';
      themeToggle.textContent = isDark ? '☀️ Light mode' : '🌙 Night mode';
      themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      localStorage.setItem('moneyBuddyTheme', theme);
    }

    function getInitialTheme() {
      const stored = localStorage.getItem('moneyBuddyTheme');
      if (stored === 'light' || stored === 'dark') return stored;
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return prefersDark ? 'dark' : 'light';
    }

    themeToggle.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme') || 'light';
      applyTheme(current === 'light' ? 'dark' : 'light');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      handleUserMessage(text);
      input.value = '';
      input.focus();
    });

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => handleUserMessage(btn.dataset.q));
    });

    applyTheme(getInitialTheme());
    addMessage("Hi! I’m Money Buddy 👋 I can help you budget, save, and make safe money choices.");
  </script>
</body>
</html>
